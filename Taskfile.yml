version: '3'

vars:
  PYTHON_VERSION: 3.11.0
  PYENV_NAME: family-budget

tasks:
  run:
    cmds:
      - task: run:django

  run:django:
    cmds:
      - python manage.py runserver 127.0.0.1:8000

  migrate:
    cmds:
      - uv run python manage.py migrate {{ .CLI_ARGS }}

  makemigrations:
    cmds:
      - uv run python manage.py makemigrations {{ .CLI_ARGS }}

  collectstatic:
    cmds:
      - uv run python manage.py collectstatic {{ .CLI_ARGS }}

  test:
    cmds:
      - uv run pytest -svv {{ .CLI_ARGS }}

  format:ruff:
    cmds:
      - uv run ruff check --fix-only --ignore COM819
      - uv run ruff format

  format:
    cmds:
      - task: format:ruff

  lint:ruff:
    cmds:
      - uv run ruff check .

  lint:
    cmds:
      - task: lint:ruff
        vars:
          LINT_MYPY_KWARGS: '{{ default "" .LINT_MYPY_KWARGS }}'
